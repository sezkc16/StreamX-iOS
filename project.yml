
name: StreamX

options:
  bundleIdPrefix: com.streamx
  deploymentTarget:
    iOS: "16.0"

targets:
  StreamX:
    type: application
    platform: iOS
    sources:
      - path: StreamX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.streamx.player
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
